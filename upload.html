<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo không gian kỷ niệm</title>
    <!-- Thêm font chữ giống trang gốc -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* === GIAO DIỆN CHỦ ĐỀ BTS ARCHIVE === */
        * {
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif;
            /* Màu nền và hiệu ứng ánh sáng giống hệt trang gốc */
            background: #08070d;
            background-image: 
                radial-gradient(circle at 15% 8%, rgba(123,82,176,.13), transparent 27%),
                radial-gradient(circle at 90% 40%, rgba(96,66,145,.11), transparent 30%);
            color: #f7f2fa;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
        }

        .container { 
            /* Khung box giống phần message trong web gốc */
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.09);
            padding: 40px 30px; 
            border-radius: 8px; 
            box-shadow: 0 30px 70px rgba(0,0,0,0.4); 
            backdrop-filter: blur(10px);
            max-width: 450px; 
            width: 100%; 
            text-align: center;
        }

        /* Chữ BTS Archive nghệ thuật */
        .brand {
            font-family: 'DM Serif Display', serif;
            font-size: 26px;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }
        .brand span {
            font: 500 10px Montserrat;
            letter-spacing: 3px;
            color: #c7a7f2;
            margin-left: 8px;
        }

        h3 { 
            color: #c7a7f2; 
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-align: left;
            margin-bottom: 12px;
            margin-top: 25px;
        }

        /* Căn chỉnh khung chọn file fit 100% */
        input[type="file"] { 
            width: 100%; 
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(199, 167, 242, 0.3);
            border-radius: 5px;
            color: #aaa2b5;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="file"]:hover {
            border-color: rgba(199, 167, 242, 0.6);
            background: rgba(199, 167, 242, 0.05);
        }

        /* Nút Xác nhận giống nút xem memories */
        .btn { 
            background: rgba(255, 255, 255, 0.035); 
            color: #f7f2fa; 
            border: 1px solid rgba(199, 167, 242, 0.25);
            padding: 16px; 
            width: 100%; 
            border-radius: 99px; /* Nút bo tròn 2 đầu */
            cursor: pointer; 
            font-size: 12px; 
            letter-spacing: 3px;
            font-weight: 500;
            margin-top: 35px;
            transition: all 0.3s ease; 
        }

        .btn:hover { 
            background: rgba(199, 167, 242, 0.1); 
            border-color: rgba(199, 167, 242, 0.5);
            transform: translateY(-2px);
        }

        .result-box { 
            background: rgba(199, 167, 242, 0.08); 
            border: 1px solid rgba(199, 167, 242, 0.3);
            padding: 20px; 
            margin-top: 25px; 
            border-radius: 8px; 
            display: none; 
            text-align: left;
        }

        .result-box a { 
            color: #d5baf7; 
            word-break: break-all;
            font-size: 13px;
            line-height: 1.6;
            text-decoration: none;
            border-bottom: 1px solid #d5baf755;
        }

        #loading { 
            display: none; 
            color: #c7a7f2; 
            font-size: 12px;
            letter-spacing: 2px;
            text-align: center; 
            margin-top: 20px; 
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">
        BTS <span>ARCHIVE</span>
    </div>

    <h3>Chọn ảnh</h3>
    <!-- Thêm thuộc tính multiple để cho phép chọn nhiều ảnh -->
    <input type="file" id="imageInput" accept="image/*" multiple title="Chọn tối đa 6 ảnh">

    <h3>Chọn nhạc</h3>
    <input type="file" id="musicInput" accept="audio/*">

    <button class="btn" onclick="generateLink()">XÁC NHẬN</button>
    <div id="loading">ĐANG KHỞI TẠO KHÔNG GIAN CỦA BẠN...</div>

    <div class="result-box" id="resultBox">
        <p style="color: #aaa2b5; font-size: 12px; margin-top:0;">Mã liên kết của bạn đã sẵn sàng:</p>
        <a id="generatedLink" href="#" target="_blank"></a>
        <p style="font-size: 11px; margin-top:15px; color: #aaa2b5;">► Hãy sao chép liên kết này để chia sẻ.</p>
    </div>
</div>

<script>
    const CLOUD_NAME = 'la8oxnbp'; // <--- Thay tên cloud 
    const UPLOAD_PRESET = 'rzchyciv'; // <--- Thay preset 

    async function uploadFile(file, resourceType) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        return data.secure_url;
    }

    async function generateLink() {
        const imageFiles = document.getElementById('imageInput').files; // Lấy mảng các ảnh
        const musicFile = document.getElementById('musicInput').files[0];
        
        if (imageFiles.length === 0) {
            alert("Vui lòng chọn ít nhất 1 ảnh!");
            return;
        }
        
        if (imageFiles.length > 6) {
            alert("Bạn chỉ được tải lên tối đa 6 ảnh thôi nhé!");
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';

        try {
            // Khởi tạo tham số URL
            let urlParams = new URLSearchParams();

            // Tải từng ảnh lên và gắn vào tham số (img0, img1, img2...)
            for (let i = 0; i < imageFiles.length; i++) {
                let imgUrl = await uploadFile(imageFiles[i], 'image');
                urlParams.append(`img${i}`, imgUrl); 
            }
            
            // Tải nhạc lên (nếu có)
            if (musicFile) {
                let musicUrl = await uploadFile(musicFile, 'video'); 
                urlParams.append('music', musicUrl);
            }

            // Tạo link dẫn về trang gốc (cắt bỏ phần đuôi nếu có)
            let baseUrl = window.location.href.split('?')[0].replace('upload.html', 'index.html');
            
            // Ghép nối tạo link cuối cùng
            let finalUrl = baseUrl + '?' + urlParams.toString();

            // Hiển thị kết quả
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('generatedLink').href = finalUrl;
            document.getElementById('generatedLink').textContent = finalUrl;

        } catch (error) {
            alert("Có lỗi xảy ra khi tải file! Vui lòng thử lại.");
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>
</body>
</html>
